[package]
name = "thomson-calculator"
version = "0.1.0"
description = "Calculates LC tank values (Thomson formula)"
authors = ["Roman Senn <roman.l.senn@gmail.com>"]
license = "MIT"
repository = "https://github.com/rsenn/thomson-calculator"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
# no plugins and no runtime ACLs: only the window, the web view and what the
# platforms need (X11 on Linux, common controls on Windows)
tauri = { version = "2.12.5", default-features = false, features = ["wry", "x11", "common-controls-v6"] }

# smallest binary: size over speed, whole-program optimisation, no unwinding
# machinery, no symbols
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
