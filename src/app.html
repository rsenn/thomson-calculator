<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>LC circuit calculation</title>
    <link rel="icon" type="image/png" sizes="16x16" href="favicon.png" />
    <link rel="shortcut icon" sizes="16x16 32x32 48x48 64x64 128x128 256x256" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="stylesheets/main.css" />
    <script src="app.js" type="module"></script>
    <script>
      // offline cache, only where there is a server (not file:// in Electron/Tauri)
      if('serviceWorker' in navigator && location.protocol.startsWith('http'))
        addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    </script>
  </head>
  <body>
    <h2 class="basic">Thomson's formula</h2>
    <img class="basic" src="svg/freq-equation.svg" />
    <form class="basic" action="" onsubmit="">
      <div id="fields" style="display: inline-grid; grid-template-columns: 1.2em 6.5em 1fr">
        <label class="var inductance"><b>L</b></label>
        <label class="name inductance">Inductance</label>
        <input type="text" size="20" name="L" value="" />
        <label class="var capacitance"><b>C</b></label>
        <label class="name capacitance">Capacitance</label>
        <input type="text" size="20" name="C" value="" />
        <label class="var frequency"><b>f</b></label>
        <label class="name frequency">Frequency</label>
        <input type="text" size="20" name="f" value="" />
      </div>
      <div id="precision_grp">
        <label for="precision" id="precision_lbl">Precision</label>
        <input type="range" id="precision" name="precision" min="0" max="9" />
        <input type="number" id="precision_num" name="precision_num" value="" size="2" />
      </div>
      <div id="note">&nbsp;</div>
      <div id="status">&nbsp;</div>
    </form>
    <section id="advanced">
      <h2>Tank networks</h2>
      <div id="network_fields">
        <label class="var inductance"><b>L</b></label>
        <label class="name inductance">Inductance</label>
        <input type="text" id="network_L" spellcheck="false" autocomplete="off" placeholder="300u" />
        <label class="var capacitance"><b>C</b></label>
        <label class="name capacitance">Capacitance</label>
        <input type="text" id="network_C" spellcheck="false" autocomplete="off" placeholder="Cosc=3.8p..85.8p | Ctrim=3.5p" />
      </div>
      <div id="network_error" hidden></div>
      <div id="network_views">
        <div id="schematic"></div>
        <div id="equation"></div>
      </div>
      <table id="network_result" hidden>
        <tbody></tbody>
      </table>
      <div id="part_panel" hidden>
        <b id="part_name"></b> <span id="part_value"></span>
        <span class="sep">|</span>
        <label for="part_target">for f =</label>
        <input type="text" id="part_target" size="10" placeholder="100M" spellcheck="false" autocomplete="off" />
        <button type="button" id="part_solve">Solve</button>
        <span id="part_result"></span>
        <button type="button" id="part_use" hidden>Use</button>
      </div>
      <div id="network_help"><b>+</b> series &nbsp; <b>|</b> parallel &nbsp; <b>( )</b> group &nbsp; values like <b>100n</b> or a named part <b>Ltrim=5u</b> &nbsp; a range <b>3.8p..85.8p</b> is a knob &nbsp; click a part to select it</div>
    </section>
    <label id="mode" title="Switch between the Thomson calculator and the free network view"><input type="checkbox" id="advanced_toggle" /> Advanced</label>
  </body>
</html>
